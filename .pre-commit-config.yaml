ci:
  autofix_prs: true

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c  # frozen: v0.17.3
    hooks:
      - id: ruff-format
        args: ["--diff", "src", "tests"]
      - id: ruff-check
        args: ["src", "tests"]

  - repo: https://github.com/PyCQA/doc8
    rev: 2a7a5eef1de341fab48019faf3de8a64ac2ad900  # frozen: v2.0.0
    hooks:
      - id: doc8
        language: python
        additional_dependencies:
          - toml==0.10.2

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # frozen: v1.31.1
    hooks:
      - id: zizmor
        name: Check GitHub Actions with zizmor
        files: ^\.github/
        pass_filenames: false
        args: [".github"]
