ci:
  autofix_prs: true

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5  # frozen: v0.17.4
    hooks:
      - id: ruff-format
        args: ["--diff", "src", "tests"]
      - id: ruff-check
        args: ["src", "tests"]

  - repo: https://github.com/PyCQA/doc8
    rev: 2a7a5eef1de341fab48019faf3de8a64ac2ad900  # frozen: v2.0.0
    hooks:
      - id: doc8
        language: python
        additional_dependencies:
          - toml==0.10.2

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # frozen: v1.32.0
    hooks:
      - id: zizmor
        name: Check GitHub Actions with zizmor
        files: ^\.github/
        pass_filenames: false
        args: [".github"]
