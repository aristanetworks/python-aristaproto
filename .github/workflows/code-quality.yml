name: Code Quality

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  check-formatting:
    name: Check code/doc formatting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        python-version: '3.11'
        activate-environment: true
    - name: Install locked lint dependencies
      run: uv sync --locked --only-group lint --no-build
    - name: Run pre-commit with locked tools
      run: uv run --no-sync --no-build --only-group lint pre-commit run --config .github/pre-commit-ci.yaml --show-diff-on-failure --color=always --all-files
